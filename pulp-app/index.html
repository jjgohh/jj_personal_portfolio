<!-- ══ REMOVE BOTH OF THESE AT LAUNCH ══════════════════════════════════════
     This meta tag and public/robots.txt keep the site out of search results
     while it is a private preview. PULP cannot be sold until NPRA product
     notification is complete, so a page for an un-notified product must not be
     indexable — and the page says so itself in the utility bar ("PRIVATE
     PREVIEW · NOTIFICATION PENDING"). The founders' price, MAL[NUMBER] and
     KKLIU [NUMBER] are also still placeholders, and a crawler that caches them
     now can keep serving them long after they are filled in.

     At launch delete this tag AND public/robots.txt, in the same commit. Leaving
     either behind silently blocks all organic search.
     ═══════════════════════════════════════════════════════════════════════ -->
<meta name="robots" content="noindex, nofollow" />
<meta property="og:title" content="PULP — The vitamin E most supplements skip" />
<meta property="og:description" content="Four tocotrienols plus alpha-tocopherol, 50 mg per softgel. Grown, extracted and bottled in Malaysia." />
<meta property="og:type" content="website" />
<!--
  ══ CANONICAL DOMAIN ═══════════════════════════════════════════════════════
  og:url and og:image must be ABSOLUTE and must resolve on the domain actually
  being served, or the link preview silently falls back to a bare grey card.
  pulp.my is used here because the WhatsApp share text in Reserve.jsx already
  assumes it. While the site is served from goldenpulp.netlify.app instead, these
  two URLs will 404 for scrapers — point DNS at pulp.my, or change all three
  places (here, og:url, and the share text) together.

  og.png is generated by `npm run assets` from the site's own tokens and fonts.
  Regenerate it if the wordmark, palette or headline changes.
  ═══════════════════════════════════════════════════════════════════════════ -->
<link rel="canonical" href="https://pulp.my/" />
<meta property="og:url" content="https://pulp.my/" />
<meta property="og:site_name" content="PULP" />
<meta property="og:locale" content="en_MY" />
<meta property="og:image" content="https://pulp.my/og.png" />
<meta property="og:image:type" content="image/png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="PULP No. 001 — an amber softgel beside the words: the vitamin E most supplements skip. Alpha, beta, gamma, delta plus tocopherol, 50 mg per softgel, Malaysia." />
